[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opsbrief"
version = "0.1.0"
description = "Local-first planning assistant for engineering teams"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
opsbrief = "opsbrief.__main__:main"

[tool.setuptools.packages.find]
include = ["opsbrief*"]
